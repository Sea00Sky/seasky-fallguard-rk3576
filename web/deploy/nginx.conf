# 衡护 HENGUARD 云端 Web —— nginx V1 反向代理（HTTP 80）
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/fallguard.conf
#   sudo sed -i 's/__DOMAIN__/实际域名/g' /etc/nginx/sites-available/fallguard.conf
#   sudo ln -sf /etc/nginx/sites-available/fallguard.conf /etc/nginx/sites-enabled/fallguard.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 占位符 __DOMAIN__：部署时替换成真实域名（备案通过后 80/443 才能正常对外服务）。
# 应用只监听 127.0.0.1:8000，不直接暴露公网。

server {
    listen 80;
    # 服务器若没开 IPv6，下面这行会让 nginx -t 报 "Address family not supported"，按需启用
    # listen [::]:80;
    server_name __DOMAIN__;

    # push body 固定 ≤1280 B；快照 JPEG 约 15–25 KB，2 MB 上限足够且能挡住误传大文件
    client_max_body_size 2m;

    # ── 安全响应头（2026-11-07 第100轮补；第99轮严格检查 §五 的四个缺口）──────
    # 全部带 always：401/403/404/500/502 这些错误页也要有，否则「打不到页面就不设防」。
    # ⚠️ nginx 的 add_header **只在「当前层级没有 add_header」时才向上继承**
    #    ⇒ 这四行只能放 server 级，且以后新增 location 时**不许再写 add_header**，
    #    否则那一个 location 会静默丢掉全部四个头。
    # ⚠️ CSP 是「兼容档」：站点没有 iframe、没有外链资源；13 处内联 <script> 与
    #    5 处动态 style="height:xx%" 必须保留 'unsafe-inline'（动态值没法算 hash）。
    #    仍能挡：外链脚本/样式注入、object/embed、base 劫持、表单外发、被第三方 iframe 嵌套。
    # ⚠️ 不要在 HTTP 阶段加 HSTS：443 还被腾讯云安全组挡着，浏览器记住 https 后全站打不开。
    #    TLS 上线后再加 Strict-Transport-Security（见文末）。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    access_log /var/log/nginx/fallguard.access.log;
    error_log  /var/log/nginx/fallguard.error.log warn;

    # ── SSE 实时通道：必须单独处理 ──────────────────────────────────
    # proxy_buffering off 是硬要求：开着的话 nginx 会把事件攒在缓冲区，
    # 护士端表现为"告警卡片延迟几十秒才出现"，且很难排查。
    # proxy_read_timeout 必须远大于应用 15 秒一次的 ping 间隔。
    # 注意：nginx 配置只认双引号，Connection 的空值要写成 ""（写成 '' 会启动失败）。
    location = /api/v1/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 应用侧还会发 X-Accel-Buffering: no 作为双保险
    }

    # ── 设备接入（板端 push / 快照上传）────────────────────────────
    # 关闭请求缓冲，快照 PUT 直接流给应用，不在 nginx 落临时文件。
    # 这两个接口用路径里的 ingest_key 鉴权，不依赖 Cookie。
    location ^~ /api/v1/ingest/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── 健康检查：给运维和演示看，不写访问日志 ──────────────────────
    # 如需只允许内网，在此加 allow/deny 后再 reload。
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── 其余全部请求（页面 / REST API / 快照读取）──────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# ══════════════════════════════════════════════════════════════════════
# 上 TLS 之后怎么改（备案 + 证书下来再动，V1 先不做）
# ──────────────────────────────────────────────────────────────────────
# 1) 80 端口只保留跳转：
#      server {
#          listen 80;
#          server_name __DOMAIN__;
#          return 301 https://$host$request_uri;
#      }
# 2) 新增 443 server，把上面所有 location 原样搬进去，并加：
#      server {
#          listen 443 ssl;
#          http2 on;                      # nginx ≥ 1.25.1；更老版本写 listen 443 ssl http2;
#          server_name __DOMAIN__;
#
#          ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
#          ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
#          ssl_protocols       TLSv1.2 TLSv1.3;
#          ssl_session_cache   shared:SSL:10m;
#          add_header Strict-Transport-Security "max-age=31536000" always;
#          ... 其余 location 不变 ...
#      }
#    证书续期：certbot renew --deploy-hook "systemctl reload nginx"
# 3) 应用侧必须同时改两处（否则登录会坏或失去 CSRF 防护）：
#    - Cookie 加 Secure 标志；
#    - CSRF 从 SameSite=Lax 升级为双提交 token（设计 §10.2 已注明"上 TLS 后必须补"）。
#
# ── 为什么现在 Cookie 不加 Secure ────────────────────────────────────
# V1 走 http://__DOMAIN__ 明文访问。浏览器对 Secure Cookie 的规则是：
# 在非 HTTPS 页面上 Set-Cookie 带 Secure 会被直接丢弃，而且不报错。
# 表现是「登录接口返回 200，下一个请求却是 401」，看起来像会话 bug，
# 实际是浏览器根本没存 Cookie。所以 V1 明确不加 Secure，
# 等 443 上线后再加（同时把 SameSite 之外再补 CSRF token）。
# ══════════════════════════════════════════════════════════════════════
