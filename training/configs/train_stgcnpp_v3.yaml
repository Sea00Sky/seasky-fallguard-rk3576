# Phase 3.17 — ST-GCN++ baseline on windows v3 (MCFD fall intervals from the
# manual layer). Everything else is byte-for-byte the D-023 baseline protocol:
# 1.38M params, SGD lr 0.02, 30 epochs, batch 16, plain CE, no augmentation,
# seed 42, best checkpoint by val fall-class F1 at threshold 0.5, test once.
# The only changed variable versus configs/train_stgcnpp.yaml is the data layer.

data:
  ann_file: datasets/pyskl/v3/annotations.pkl
  clip_len: 64
  num_person: 1
  num_classes: 2
  class_names: [non_fall, fall]
  batch_size: 16
  num_workers: 2

model:
  type: RecognizerGCN
  backbone:
    type: STGCN
    gcn_adaptive: init
    gcn_with_res: true
    tcn_type: mstcn
    graph_cfg:
      layout: coco
      mode: spatial
  cls_head:
    type: GCNHead
    num_classes: 2
    in_channels: 256

train:
  epochs: 30
  optimizer: SGD
  lr: 0.02
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true
  scheduler: cosine
  eta_min_ratio: 0.01
  seed: 42
  device: cuda
  class_weights: null      # null = plain CE; "balanced" = inverse frequency
  eval_every: 1

eval:
  threshold: 0.5

output:
  run_dir: runs/stgcnpp_v3
  report: reports/train_stgcnpp_v3.md
