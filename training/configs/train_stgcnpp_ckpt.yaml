# Model-selection infrastructure (D-037) — not a numbered worklog phase.
# Identical to configs/train_stgcnpp.yaml except that per-epoch checkpoints are
# kept under runs/<run>/epochs/. Used only by scripts/27, which overrides
# output.run_dir/report to runs/ms_v2/<name> and reports/model_selection/runs/;
# the run_dir/report below are placeholders that are never written.
# The training protocol itself is unchanged (D-023).

data:
  ann_file: datasets/pyskl/v2/annotations.pkl
  clip_len: 64
  num_person: 1
  num_classes: 2
  class_names: [non_fall, fall]
  batch_size: 16
  num_workers: 2

model:
  type: RecognizerGCN
  backbone:
    type: STGCN
    gcn_adaptive: init
    gcn_with_res: true
    tcn_type: mstcn
    graph_cfg:
      layout: coco
      mode: spatial
  cls_head:
    type: GCNHead
    num_classes: 2
    in_channels: 256

train:
  epochs: 30
  optimizer: SGD
  lr: 0.02
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true
  scheduler: cosine
  eta_min_ratio: 0.01
  seed: 42
  device: cuda
  class_weights: null
  eval_every: 1
  checkpoint_every:
    enabled: true
    every: 1

eval:
  threshold: 0.5

output:
  run_dir: runs/stgcnpp_v2_ckpt
  report: reports/train_stgcnpp_v2_ckpt.md
