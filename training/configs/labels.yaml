# Binary fall detection label and window policy.

labels:
  0: non_fall
  1: fall

# D-015: canonical internal frame interval is 0-based half-open [start, end).
# Legacy `interval_frames` (= end - start) in annotations v2 is informational
# only; window building must convert using this block, never that column.
interval_semantics:
  canonical: "0-based half-open [start, end)"
  sources:
    le2i_raw: {base: 1, end_inclusive: true}   # annotation rows run 1..n_frames
    mcfd_raw: {base: 1, end_inclusive: true}   # contiguous periods, MATLAB-style export
    manual: {base: 0, end_inclusive: true}     # interval_tool.py OpenCV indices
  mcfd_base_risk: "if the CSV turns out 0-based, MCFD shifts by 1 frame = 8.3 ms at 120 fps"

# D-008 window geometry; D-017 labeling; D-018 person selection / missing data.
window:
  duration_s: 2.0
  stride_s: 0.5
  guard_s: 0.5
  negative_min_distance_from_fall_s: 0.5
  resample_frames: 64
  min_coverage: 0.70           # selected track present in >= 70% of window frames
  max_interp_gap_frames: 10    # linear interpolation only for short gaps
  person_selection: max_presence
  coordinate_norm: image_size  # x / width, y / height -> [0, 1]

labeling:
  positive:
    - "any fall interval start s satisfies window_start <= s < window_end (onset rule, D-017)"
  negative:
    - "zero overlap with any fall interval and distance to nearest fall interval >= negative_min_distance_from_fall_s"
  ambiguous: drop
  mcfd_note: "MCFD label-0 segments adjacent to label-1 are context; the negative-distance guard keeps boundary windows out of the negative set."

split:
  version: v2
  seed: 42
  ratios: {train: 0.70, val: 0.15, test: 0.15}
  unit: event_id
  stratify_by: [dataset, label]
  forbidden:
    - "same event_id in two splits"
    - "same MCFD chute split across cameras"
    - "URFD left/right halves treated as separate events"
