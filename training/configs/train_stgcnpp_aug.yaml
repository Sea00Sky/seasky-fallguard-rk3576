# Phase 3.5 — augmentation ablation on the same windows / pkl as Phase 3.3.
# Single variable vs configs/train_stgcnpp.yaml: data.train_augment.
# Class weights stay off, so the effect of augmentation is isolated.
# Transforms run after PreNormalize2D on x/y only; the score channel is untouched.

data:
  ann_file: datasets/pyskl/v2/annotations.pkl
  clip_len: 64
  num_person: 1
  num_classes: 2
  class_names: [non_fall, fall]
  batch_size: 16
  num_workers: 2
  # Random similarity transform per person/clip, applied to training samples only.
  train_augment:
    rotate: 0.2      # rad, uniform ±0.2 (~11.5°)
    scale: 0.1       # isotropic factor in [0.9, 1.1]
    translate: 0.02  # normalized x/y units, uniform ±0.02
    jitter: 0.01     # Gaussian sigma = 1% of the skeleton diagonal

model:
  type: RecognizerGCN
  backbone:
    type: STGCN
    gcn_adaptive: init
    gcn_with_res: true
    tcn_type: mstcn
    graph_cfg:
      layout: coco
      mode: spatial
  cls_head:
    type: GCNHead
    num_classes: 2
    in_channels: 256

train:
  epochs: 30
  optimizer: SGD
  lr: 0.02
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true
  scheduler: cosine
  eta_min_ratio: 0.01
  seed: 42
  device: cuda
  class_weights: null
  eval_every: 1

eval:
  threshold: 0.5

output:
  run_dir: runs/stgcnpp_v2_aug
  report: reports/train_stgcnpp_v2_aug.md
