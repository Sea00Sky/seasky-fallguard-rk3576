# Phase 3.7 — ST-GCN++ initialised from official NTU RGB+D XSub HRNet Joint weights.
# Single variable vs configs/train_stgcnpp.yaml: train.pretrained.
# Optimiser, epochs, loss, class weights and augmentation are unchanged.
# The 60-class cls_head.fc_cls is re-initialised for our 2 classes (non_fall=0, fall=1).

data:
  ann_file: datasets/pyskl/v2/annotations.pkl
  clip_len: 64
  num_person: 1
  num_classes: 2
  class_names: [non_fall, fall]
  batch_size: 16
  num_workers: 2

model:
  type: RecognizerGCN
  backbone:
    type: STGCN
    gcn_adaptive: init
    gcn_with_res: true
    tcn_type: mstcn
    graph_cfg:
      layout: coco
      mode: spatial
  cls_head:
    type: GCNHead
    num_classes: 2
    in_channels: 256

train:
  epochs: 30
  optimizer: SGD
  lr: 0.02
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true
  scheduler: cosine
  eta_min_ratio: 0.01
  seed: 42
  device: cuda
  class_weights: null
  pretrained: weights/ntu60_xsub_hrnet_j.pth
  eval_every: 1

eval:
  threshold: 0.5

output:
  run_dir: runs/stgcnpp_v2_pretrained
  report: reports/train_stgcnpp_v2_pretrained.md
